<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>breva bonn — Under Construction</title>
  <meta name="description" content="Temporäre Seite: Under Construction – breva bonn GmbH. Kontakt: info@breva.co, +49 1522 673 733 9" />
  <!-- Albert Sans (wie gewünscht) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --text:#111; --muted:#9aa1a9;
      --tape-yellow:#ffd100; --tape-black:#111;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:#fff;color:var(--text);font-family:'Albert Sans',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}

    .page{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

    /* ===== WARNBÄNDER – gespiegelt (oben rechts & unten links) ===== */
    .tapes{position:absolute;inset:0;pointer-events:none;z-index:0}
    .tapes .cluster{position:absolute;display:flex;flex-direction:column;gap:16px}
    .tapes .cluster.top-right{top:-60px;right:-30vw;transform:rotate(17deg) scaleX(-1)}
    .tapes .cluster.bottom-left{bottom:-60px;left:-30vw;transform:rotate(-17deg) scaleX(-1)}

    .band{width:140vw;height:110px;border:1px solid rgba(0,0,0,.25);border-radius:6px;position:relative;overflow:hidden}
    .band::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,var(--tape-yellow) 0 46px,var(--tape-black) 46px 92px)}
    .band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%, rgba(0,0,0,.08) 70%, rgba(0,0,0,.18));mix-blend-mode:multiply}

    @media (max-width:640px){
      .band{height:84px}
      .tapes .cluster{gap:12px}
    }

    /* ===== INHALT ===== */
    .wrap{position:relative;z-index:1;width:min(1120px,92vw);margin:0 auto;padding:32px}
    .stack{max-width:820px}
    h1{font-size:clamp(36px,8vw,80px);line-height:.95;margin:0 0 8px;font-weight:800;letter-spacing:.2px}
    .sub{margin:0 0 28px;font-size:clamp(20px,3.4vw,38px);line-height:1;letter-spacing:.2px;color:#9aa1a9;font-weight:700}

    .brand{max-width:min(35vw,280px);height:auto;margin:8px 0 14px;display:block}

    .contact{font-size:clamp(14px,2.2vw,18px);line-height:1.45}
    .contact a{color:inherit;text-decoration:none}
    .contact a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="page" aria-label="Under Construction">
    <!-- Warnbänder gespiegelt: oben rechts (3x) und unten links (3x) -->
    <div class="tapes" aria-hidden="true">
      <div class="cluster top-right">
        <div class="band"></div>
        <div class="band"></div>
        <div class="band"></div>
      </div>
      <div class="cluster bottom-left">
        <div class="band"></div>
        <div class="band"></div>
        <div class="band"></div>
      </div>
    </div>

    <!-- Inhalt -->
    <div class="wrap">
      <div class="stack">
        <h1>UNDER CONSTRUCTION</h1>
        <p class="sub">COMING SOON</p>
        <img class="brand" src="brevabonngmbh-high-resolution-logo-grayscale-transparent.png" alt="brevabonngmbh Logo transparent" />
        <div class="contact">
          <div><a href="mailto:info@breva.co">info@breva.co</a></div>
          <div><a href="tel:+4915226737339">+49 1522 673 7339</a></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
